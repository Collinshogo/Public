# GitHub Pages (Jekyll) build settings: keep working files out of the published site.
# Entries are path prefixes: "tracking/" (the folder) must not catch tracking.js.
exclude:
  - docs/
  - tracking/
  - README.md
  - "*.py"
  - "*.md"
# agents.md is published for AI assistants; "include" overrides the "*.md" rule above for it alone.
include:
  - agents.md
